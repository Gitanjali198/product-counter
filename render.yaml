services:
  - type: web
    name: product-counter
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python api.py"
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
